<!-- components/app_header.html -->
<!-- Este componente representa o cabeçalho para o painel do Administrador da Câmara. -->
<header class="content-header">
  <div class="header-title">
    <!-- O ícone e o título serão preenchidos dinamicamente pela página que carregar o componente -->
    <i id="header-icon" class="fa-solid"></i>
    <h2 id="header-title"></h2>
  </div>
  <div class="user-info" aria-label="Nível de acesso">
    <div class="admin-icon-badge camara-admin-badge" aria-hidden="true">
      <i class="fas fa-landmark"></i>
    </div>
    <div class="user-details">
      <span class="name camara-admin-name">Admin da Câmara</span>
    </div>
  </div>
</header>
